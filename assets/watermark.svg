<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <style>
    .wm-title { font-family: 'UnifrakturMaguntia', 'Georgia', serif; font-size: 38px; fill: #171411; fill-opacity: 0.025; font-weight: bold; text-anchor: middle; }
    .wm-sub { font-family: 'Libre Baskerville', 'Georgia', serif; font-size: 16px; letter-spacing: 0.35em; fill: #171411; fill-opacity: 0.02; text-anchor: middle; text-transform: uppercase; }
    .wm-line { stroke: #171411; stroke-opacity: 0.02; stroke-width: 1.5; }
  </style>
  <g transform="rotate(-15 300 200)">
    <line x1="50" y1="145" x2="550" y2="145" class="wm-line" />
    <text x="300" y="190" class="wm-title">THE PATHAK PRESS</text>
    <text x="300" y="225" class="wm-sub">TECHNICAL ARCHIVES · EST. 2026</text>
    <line x1="50" y1="245" x2="550" y2="245" class="wm-line" />
  </g>
</svg>
